<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ale - skdjskj</title>
    <!-- Cargamos la fuente divertida y redondeada "Fredoka" de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Colores principales solicitados */
            --bg-color: #FFFFFF;
            --accent-1: #86D9EA; /* Principal */
            --accent-2: #427672; /* Secundario */
            
            /* Derivados para el modo claro */
            --box-bg: #F4FAFC; /* Un tono super claro del principal para los bloques */
            --box-border: #D8F1F6;
            --text-main: #427672;
            --text-muted: #5a8b87;
            --shadow: 0 8px 24px rgba(134, 217, 234, 0.15);
            --hover-shadow: 0 12px 32px rgba(134, 217, 234, 0.3);
        }

        /* Variables para el modo oscuro */
        [data-theme="dark"] {
            --bg-color: #0f1617;
            --box-bg: #162224;
            --box-border: #233f3d;
            --text-main: #F4FAFC;
            --text-muted: #86D9EA;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            --hover-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.4s ease, color 0.4s ease;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .bento-wrapper {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 columnas en celular */
            gap: 16px;
            max-width: 900px;
            margin: 2rem auto;
            padding: 20px;
        }

        .bento-item {
            background: var(--box-bg);
            border: 2px solid var(--box-border);
            border-radius: 28px;
            padding: 24px;
            box-shadow: var(--shadow);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, background-color 0.4s, border-color 0.4s;
            animation: fadeUp 0.6s ease-out forwards;
            opacity: 0;
        }

        .bento-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--hover-shadow);
        }

        /* Animación suave de carga */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-card { 
            grid-column: span 2; 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            animation-delay: 0.1s;
        }
        .theme-card { 
            grid-column: span 2; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 10px; 
            animation-delay: 0.2s;
        }
        .tabs-card { 
            grid-column: span 2; 
            padding: 15px; 
            animation-delay: 0.3s;
        }

        /* Perfil */
        .profile-pic {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-1);
        }
        .profile-name { font-size: 2.2rem; margin: 0; line-height: 1.1; font-weight: 600; }
        .profile-subtitle { font-size: 1.1rem; color: var(--text-muted); margin: 0; font-weight: 400; }

        /* Botón Modo Oscuro */
        .icon-btn {
            background: transparent; border: none; font-size: 1.8rem; cursor: pointer;
            transition: transform 0.3s;
        }
        .icon-btn:hover { transform: scale(1.1) rotate(15deg); }

        .tabs {
            display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px;
        }
        .tabs::-webkit-scrollbar { height: 4px; }
        .tabs::-webkit-scrollbar-thumb { background: var(--accent-1); border-radius: 10px; }

        .tab-btn {
            flex: 1; min-width: max-content; padding: 12px 20px; border-radius: 20px;
            background: transparent; color: var(--text-main); font-family: inherit;
            font-weight: 500; font-size: 1.1rem; cursor: pointer; border: 2px solid transparent;
            transition: all 0.3s;
        }
        .tab-btn:hover { background: rgba(134, 217, 234, 0.2); }
        .tab-btn.active {
            background: var(--accent-1); color: #1a1a1a; border-color: var(--accent-1);
            font-weight: 600;
        }

        /* Contenedor de contenido de pestañas (usa display contents para mantener el grid) */
        .tab-pane { display: none; }
        .tab-pane.active { display: contents; }

        .accordion-card { grid-column: span 2; padding: 0; overflow: hidden; }
        details { padding: 24px; cursor: pointer; transition: all 0.3s; }
        summary {
            font-size: 1.4rem; font-weight: 600; list-style: none;
            display: flex; justify-content: space-between; align-items: center;
        }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '+'; font-size: 1.8rem; transition: transform 0.3s; color: var(--accent-1); }
        details[open] summary::after { transform: rotate(45deg); color: var(--accent-2); }
        
        .accordion-body {
            max-height: 0; opacity: 0; overflow: hidden; transition: all 0.4s ease;
            font-size: 1.1rem; color: var(--text-muted);
        }
        details[open] .accordion-body { max-height: 500px; opacity: 1; padding-top: 15px; }

        .gallery-item {
            display: flex; align-items: center; justify-content: center;
            aspect-ratio: 1; cursor: pointer; font-weight: 600; font-size: 1.2rem;
            text-align: center; border: none;
        }
        .gallery-item:hover { transform: scale(1.05); z-index: 2; }
        
        /* Paleta para los recuadros de la galería */
        .bg-1 { background: var(--accent-1); color: #1a1a1a; }
        .bg-2 { background: var(--accent-2); color: #fff; }
        .bg-3 { background: #E0F4F8; color: #427672; }
        .bg-4 { background: #2A4B48; color: #fff; }
        .bg-5 { background: #A8E6F2; color: #1a1a1a; }
        .bg-6 { background: #5C9A95; color: #fff; }

        .lightbox {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        
        .lightbox-content-wrapper { position: relative; width: 90%; max-width: 600px; }
        .lightbox-body {
            width: 100%; aspect-ratio: 4/3; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; font-family: 'Fredoka', sans-serif; font-weight: 600;
            transform: scale(0.8); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .lightbox.active .lightbox-body { transform: scale(1); }
        
        .lightbox-close {
            position: absolute; top: -50px; right: 0; background: transparent; border: none;
            color: white; font-size: 2rem; cursor: pointer; transition: transform 0.3s;
        }
        .lightbox-close:hover { transform: scale(1.2); }

        /* Botones flotantes */
        .floating-btn {
            position: fixed; z-index: 900; width: 56px; height: 56px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); cursor: pointer; transition: all 0.3s;
            border: none; color: white; text-decoration: none;
        }
        .wa-btn { bottom: 20px; right: 20px; background: #25D366; }
        .wa-btn svg { width: 32px; height: 32px; }
        .wa-btn:hover { transform: scale(1.1); background: #1ebd5a; }

        .up-btn { bottom: 90px; right: 20px; background: var(--accent-1); opacity: 0; pointer-events: none; color: #1a1a1a; }
        .up-btn svg { width: 28px; height: 28px; }
        .up-btn:hover { transform: scale(1.1); background: var(--accent-2); color: white; }

        @media (min-width: 768px) {
            .bento-wrapper { grid-template-columns: repeat(4, 1fr); padding: 40px; gap: 20px; }
            .profile-card { grid-column: span 3; }
            .theme-card { grid-column: span 1; }
            .tabs-card { grid-column: span 4; }
            .accordion-card { grid-column: span 4; }
            
            /* Distribución de la galería estilo Bento en Desktop */
            .gal-1 { grid-column: span 2; grid-row: span 2; font-size: 1.8rem; }
            .gal-2 { grid-column: span 1; }
            .gal-3 { grid-column: span 1; }
            .gal-4 { grid-column: span 2; aspect-ratio: 2/1; }
            .gal-5 { grid-column: span 2; }
            .gal-6 { grid-column: span 2; }
        }
    </style>
</head>
<body>

    <main class="bento-wrapper">
        
        <!-- Tarjeta de Perfil -->
        <div class="bento-item profile-card">
            <!-- Imagen redonda (se usa un placeholder con los colores solicitados) -->
            <img src="https://placehold.co/150x150/86D9EA/427672?text=Ale" alt="Ale" class="profile-pic">
            <div class="profile-info">
                <h1 class="profile-name">Ale</h1>
                <h2 class="profile-subtitle">skdjskj</h2>
            </div>
        </div>

        <!-- Botón de Modo Oscuro -->
        <div class="bento-item theme-card">
            <button id="themeToggle" class="icon-btn" aria-label="Cambiar tema">🌙</button>
        </div>

        <!-- Menú de Pestañas -->
        <div class="bento-item tabs-card">
            <nav class="tabs">
                <button class="tab-btn active" data-target="presentacion">Presentación</button>
                <button class="tab-btn" data-target="servicios">Servicios</button>
                <button class="tab-btn" data-target="contacto">Contacto</button>
                <button class="tab-btn" data-target="redes">Redes</button>
            </nav>
        </div>

        <div id="presentacion" class="tab-pane active">
            <!-- Texto Desplegable -->
            <div class="bento-item accordion-card" style="animation-delay: 0.1s;">
                <details open>
                    <summary>Sobre mí</summary>
                    <div class="accordion-body">
                        <p>Hola! Soy Ale y quiero mostrar lo que estoy aprendiendo a hacer</p>
                    </div>
                </details>
            </div>
            
            <!-- Galería Grilla 6 imágenes -->
            <div class="bento-item gallery-item bg-1 gal-1" onclick="openLightbox(this)" style="animation-delay: 0.2s;"><span>Imagen 1</span></div>
            <div class="bento-item gallery-item bg-2 gal-2" onclick="openLightbox(this)" style="animation-delay: 0.3s;"><span>Imagen 2</span></div>
            <div class="bento-item gallery-item bg-3 gal-3" onclick="openLightbox(this)" style="animation-delay: 0.4s;"><span>Imagen 3</span></div>
            <div class="bento-item gallery-item bg-4 gal-4" onclick="openLightbox(this)" style="animation-delay: 0.5s;"><span>Imagen 4</span></div>
            <div class="bento-item gallery-item bg-5 gal-5" onclick="openLightbox(this)" style="animation-delay: 0.6s;"><span>Imagen 5</span></div>
            <div class="bento-item gallery-item bg-6 gal-6" onclick="openLightbox(this)" style="animation-delay: 0.7s;"><span>Imagen 6</span></div>
        </div>

        <div id="servicios" class="tab-pane">
            <div class="bento-item accordion-card">
                <details open>
                    <summary>Servicios</summary>
                    <div class="accordion-body">
                        <!-- El texto está vacío por instrucción, listo para que agregues tus servicios -->
                        <p>...</p> 
                    </div>
                </details>
            </div>
        </div>

        <div id="contacto" class="tab-pane">
            <div class="bento-item accordion-card">
                <details open>
                    <summary>Contacto</summary>
                    <div class="accordion-body">
                        <p>1144445555 @fulanitodetal</p>
                    </div>
                </details>
            </div>
        </div>

        <div id="redes" class="tab-pane">
            <div class="bento-item accordion-card">
                <details open>
                    <summary>Redes</summary>
                    <div class="accordion-body">
                        <p>@fulanitodetal</p>
                    </div>
                </details>
            </div>
        </div>

    </main>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <div class="lightbox-content-wrapper" onclick="event.stopPropagation()">
            <button class="lightbox-close" onclick="closeLightbox()" aria-label="Cerrar">&times;</button>
            <div id="lightbox-body" class="lightbox-body"></div>
        </div>
    </div>

    <!-- Botón volver arriba -->
    <button id="backToTop" class="floating-btn up-btn" onclick="scrollToTop()" aria-label="Volver arriba">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 15l-6-6-6 6"/>
        </svg>
    </button>

    <!-- Botón WhatsApp (Número a completar) -->
    <a href="https://wa.me/1144445555" class="floating-btn wa-btn" target="_blank" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.031 0C5.385 0 .002 5.385.002 12.031c0 2.122.552 4.195 1.6 6.012L.037 24l6.113-1.605c1.765.952 3.766 1.455 5.88 1.455 6.645 0 12.028-5.385 12.028-12.03S18.676 0 12.03 0h.001zm0 21.84c-1.787 0-3.535-.481-5.07-1.39l-.364-.216-3.764.988.995-3.668-.237-.377A9.97 9.97 0 0 1 2.012 12.03c0-5.526 4.498-10.023 10.02-10.023 5.521 0 10.021 4.497 10.021 10.023 0 5.526-4.499 10.02-10.02 10.02v-.01zm5.503-7.514c-.302-.15-1.785-.88-2.062-.982-.277-.1-.48-.15-.681.15-.202.302-.782.982-.958 1.183-.176.201-.354.226-.656.076-.302-.15-1.275-.47-2.428-1.5-.9-.806-1.507-1.8-1.683-2.102-.176-.301-.019-.465.132-.615.136-.135.302-.353.453-.53.151-.176.201-.301.302-.503.1-.2.05-.376-.025-.526-.075-.15-.681-1.642-.932-2.25-.246-.593-.497-.513-.681-.522-.176-.008-.376-.008-.577-.008s-.527.075-.803.376c-.276.302-1.055 1.03-1.055 2.512 0 1.482 1.08 2.914 1.23 3.115.151.2 2.124 3.243 5.143 4.545.718.309 1.28.494 1.718.632.721.229 1.378.196 1.897.12.583-.086 1.785-.73 2.037-1.436.251-.705.251-1.308.176-1.436-.075-.126-.277-.201-.58-.352z"/>
        </svg>
    </a>

    <script>
        // --- Tema Oscuro ---
        const themeBtn = document.getElementById('themeToggle');
        themeBtn.addEventListener('click', () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.body.removeAttribute('data-theme');
                themeBtn.innerHTML = '🌙';
            } else {
                document.body.setAttribute('data-theme', 'dark');
                themeBtn.innerHTML = '☀️';
            }
        });

        // --- Navegación por Pestañas ---
        const tabs = document.querySelectorAll('.tab-btn');
        const panes = document.querySelectorAll('.tab-pane');
        
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Remover clases activas
                tabs.forEach(t => t.classList.remove('active'));
                panes.forEach(p => p.classList.remove('active'));
                
                // Activar la pestaña y el panel correspondiente
                tab.classList.add('active');
                const targetId = tab.getAttribute('data-target');
                const targetPane = document.getElementById(targetId);
                targetPane.classList.add('active');
                
                // Reiniciar animaciones de los elementos internos
                const bentoItems = targetPane.querySelectorAll('.bento-item');
                bentoItems.forEach(item => {
                    item.style.animation = 'none';
                    item.offsetHeight; // Forzar reflow
                    item.style.animation = null; 
                });
            });
        });

        // --- Lightbox para la Galería ---
        const lightbox = document.getElementById('lightbox');
        const lightboxBody = document.getElementById('lightbox-body');

        function openLightbox(element) {
            // Copiamos el color de fondo y el texto del elemento original
            const bgColor = window.getComputedStyle(element).backgroundColor;
            const textColor = window.getComputedStyle(element).color;
            const text = element.innerText;
            
            lightboxBody.style.backgroundColor = bgColor;
            lightboxBody.style.color = textColor;
            lightboxBody.innerText = text;
            
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        // --- Botón Volver Arriba ---
        const backToTopBtn = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                backToTopBtn.style.opacity = '1';
                backToTopBtn.style.pointerEvents = 'auto';
            } else {
                backToTopBtn.style.opacity = '0';
                backToTopBtn.style.pointerEvents = 'none';
            }
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
